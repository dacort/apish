[package]
name = "apish"
version = "0.1.0"
edition = "2024"

[dependencies]
rustyline = "15.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
colored = "3.0"
anyhow = "1.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
